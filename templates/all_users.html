<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitBuddy Users</title><link rel="stylesheet" href="{{ url_for('static', path='style.css') }}"></head><body><div class="container wide"><div class="hero"><p class="tag">DATABASE</p><h1>All Users 👥</h1></div>{% if users %}<div class="table-wrap"><table><tr><th>User ID</th><th>Name</th><th>Age</th><th>Weight</th><th>Goal</th><th>Intensity</th><th>Action</th></tr>{% for user in users %}<tr><td>{{ user.user_id }}</td><td>{{ user.name }}</td><td>{{ user.age }}</td><td>{{ user.weight }}</td><td>{{ user.goal }}</td><td>{{ user.intensity }}</td><td><form action="/delete-user" method="post"><input type="hidden" name="user_id" value="{{ user.user_id }}"><button class="danger" type="submit">Delete</button></form></td></tr>{% endfor %}</table></div>{% else %}<div class="card"><p>No users yet.</p></div>{% endif %}<div class="links"><a href="/">Back Home</a></div></div></body></html>
