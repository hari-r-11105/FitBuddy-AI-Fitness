<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitBuddy Feedback</title><link rel="stylesheet" href="{{ url_for('static', path='style.css') }}"></head><body><div class="container"><div class="hero"><p class="tag">AI PLAN UPDATE</p><h1>Give Feedback 📝</h1><p>Tell FitBuddy what you want to change.</p></div>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<div class="card"><form action="/submit-feedback" method="post"><label>User ID</label><input name="user_id" value="{{ user_id }}" placeholder="U001" required><label>Your Feedback</label><textarea name="feedback" rows="8" placeholder="Example: The workout is too difficult. Please make it easier." required></textarea><button type="submit">Update My Plan ✨</button></form></div><div class="links"><a href="/">Back Home</a></div></div></body></html>
