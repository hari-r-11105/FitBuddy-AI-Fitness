<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitBuddy AI</title><link rel="stylesheet" href="{{ url_for('static', path='style.css') }}"></head><body><div class="container"><div class="hero"><p class="tag">AI FITNESS ASSISTANT</p><h1>FitBuddy 💪</h1><p>Create a personalized 7-day workout plan with AI.</p></div>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<div class="card"><h2>Enter Your Details</h2><form action="/generate-workout" method="post"><label>User ID</label><input name="user_id" placeholder="U001" required><label>Name</label><input name="name" placeholder="Your name" required><label>Age</label><input name="age" type="number" min="1" max="119" required><label>Weight</label><input name="weight" placeholder="60 kg" required><label>Fitness Goal</label><select name="goal" required><option value="">Select goal</option><option>Weight loss</option><option>Muscle building</option><option>General fitness</option><option>Strength</option><option>Flexibility</option><option>Endurance</option></select><label>Workout Intensity</label><select name="intensity" required><option value="">Select intensity</option><option>Beginner</option><option>Moderate</option><option>Advanced</option></select><button type="submit">Generate My Plan ✨</button></form></div><div class="links"><a href="/feedback">Give Feedback</a><a href="/view-all-users">View Users</a></div></div></body></html>
