<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your FitBuddy Plan</title><link rel="stylesheet" href="{{ url_for('static', path='style.css') }}"></head><body><div class="container"><div class="hero"><p class="tag">YOUR PERSONALIZED PLAN</p><h1>Hi, {{ user.name }}! 👋</h1><p>Goal: {{ user.goal }} · Intensity: {{ user.intensity }}</p></div>{% if message %}<div class="success">{{ message }}</div>{% endif %}<div class="card"><h2>🏋️ Workout Plan</h2><div class="plan">{{ workout_plan }}</div></div><div class="card"><h2>🥗 Nutrition Tips</h2><div class="plan">{{ nutrition_tip }}</div></div><div class="links"><a href="/feedback">Update Plan with Feedback</a><a href="/">Create Another Plan</a></div></div></body></html>
